  <path d="M96 512h82" stroke="#8da9bf" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- rodapé: descrição na esquerda, URL na direita, sem sobreposição -->
  <text x="96" y="574" font-family="Segoe UI, system-ui, sans-serif" font-size="25" fill="#94a3b8">
