    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- marca -->
  <g transform="translate(96 96)">
    <rect width="76" height="76" rx="19" fill="#22262d"/>
    <g transform="translate(14 14)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 34V14a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H20" stroke="#8da9bf" stroke-width="2.6"/>
      <path d="M4 26h10l5-12v24l7-20 4 8h14" stroke="url(#signal)" stroke-width="4"/>
    </g>
  </g>
  <text x="196" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="42"
