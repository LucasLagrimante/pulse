  <text x="96" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="70"
        font-weight="700" letter-spacing="-2.4" fill="#f1f5f9">em perspectiva.</text>

  <!-- linha de pulso decorativa -->
  <path d="M96 512h84l30-58v116l42-96 24 38h90" stroke="url(#signal)" stroke-width="5"
