[package]
name = "pulse-windows"
version = "0.1.0"
description = "Windows health and activity monitor"
authors = ["Lucas Lagrimante"]
edition = "2021"

[lib]
name = "pulse_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls"] }
keyring = { version = "4.2", default-features = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }
windows = { version = "0.61.3", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.61.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
