<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pulse.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse — Saúde do seu Windows</title>
    <style>
      /* Fundo da primeira pintura: evita o clarão branco do WebView antes de o
         CSS empacotado carregar. O tema real (data-theme) assume em seguida. */
      html,
      body {
        background: #e6edf5;
        margin: 0;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #181b20;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
