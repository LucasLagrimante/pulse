# Build do instalador NSIS em runner hospedado pelo GitHub e publicação na
# GitHub Release `v<versão>`. A etapa de assinatura (SignPath) fica pronta, mas
# desligada: o pedido à SignPath Foundation foi recusado em 2026-11 por falta de
# visibilidade pública; reaplicar quando o projeto tiver mais adoção.
#
# Configuração no repositório (Settings → Secrets and variables → Actions):
#   secret   SIGNPATH_API_TOKEN          token do usuário CI criado na SignPath
#   variable SIGNPATH_ORGANIZATION_ID    ID da organização na SignPath
#   variable SIGNPATH_PROJECT_SLUG       slug do projeto (ex.: pulse)
#   variable SIGNPATH_SIGNING_POLICY     slug da política (ex.: release-signing)
# Sem SIGNPATH_ORGANIZATION_ID a Release da tag é
# publicada SEM assinatura e as notas dizem isso; configurar as variables liga a
# assinatura nas próximas tags sem outra mudança.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-publish:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Versão e consistência da tag
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} não corresponde à versão v$version do tauri.conf.json"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=Pulse_${version}_x64-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Testes e typecheck
        run: |
          npm run typecheck
          npm test

      - name: Build do instalador NSIS
        run: npx tauri build --bundles nsis -- --locked

      - name: Enviar instalador sem assinatura
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: pulse-unsigned
          path: src-tauri/target/release/bundle/nsis/${{ steps.meta.outputs.asset }}
          if-no-files-found: error

      - name: Assinar com SignPath
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Validar assinatura e calcular SHA-256
        id: final
        shell: pwsh
        run: |
          $asset = "${{ steps.meta.outputs.asset }}"
          if ($env:SIGNING_ENABLED -eq "true") {
            $file = Join-Path signed $asset
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") { throw "Assinatura inválida: $($sig.Status) $($sig.StatusMessage)" }
            "Assinado por: $($sig.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
            $label = "assinado via SignPath"
          } else {
            $file = "src-tauri/target/release/bundle/nsis/$asset"
            "Sem assinatura: nenhum certificado configurado" >> $env:GITHUB_STEP_SUMMARY
            $label = "sem assinatura de código ; o Windows pode exibir o aviso do SmartScreen"
          }
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "path=$file" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "SHA-256: ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      - name: Publicar na GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $file = "${{ steps.final.outputs.path }}"
          # As notas vêm da mensagem da tag anotada, gerada por
          # `node scripts/release.mjs bump`. O checkout raso pode trazer a tag
          # como leve, então buscamos o objeto da tag explicitamente.
          git fetch --force --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}" 2>$null
          $changes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          $installer = @(
            "### Instaladores oficiais",
            "",
            "- **Windows 11 x64** (NSIS, ${{ steps.final.outputs.label }}): ``${{ steps.meta.outputs.asset }}`` · SHA-256 ``${{ steps.final.outputs.sha256 }}``",
            "- **Linux x86_64** (``.deb`` + ``.AppImage``): anexados nos assets abaixo com ``SHA256SUMS-linux.txt``",
            "- **macOS Apple Silicon (experimental)** (``.dmg``, sem assinatura/notarização): anexado nos assets abaixo com ``SHA256SUMS-macos.txt``"
          ) -join "`n"
          $notes = if ($changes) { "$changes`n`n---`n`n$installer" } else { $installer }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
            if ($LASTEXITCODE -eq 0) { gh release edit $tag --notes $notes }
          } else {
            gh release create $tag $file --title "Pulse ${{ steps.meta.outputs.version }}" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar na Release $tag" }

  # Linux e macOS: rodam depois do job Windows (que cria a Release) e só anexam
  # os próprios artefatos, sem tocar no instalador NSIS nem nas notas.
  # Linux: .deb + .AppImage (x86_64), sem assinatura GPG.
  build-linux:
    needs: build-sign-publish
    runs-on: ubuntu-22.04
    env:
      # O linuxdeploy é um AppImage; no runner sem FUSE ele precisa se extrair.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev patchelf build-essential file xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Build deb + AppImage
        run: npx tauri build --bundles deb,appimage -- --locked

      - name: Coletar artefatos e SHA-256
        id: files
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/
          (cd out && sha256sum *.deb *.AppImage > SHA256SUMS-linux.txt)
          { echo '```'; cat out/SHA256SUMS-linux.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-linux
          path: out/*
          if-no-files-found: error

      - name: Anexar à GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" out/* --clobber

  # macOS (experimental): .dmg para Apple Silicon (runner macos-latest = arm64).
  # SEM assinatura Developer ID e SEM notarização: o Gatekeeper bloqueia na
  # primeira abertura (abrir com botão direito → Abrir, ou
  # `xattr -dr com.apple.quarantine /Applications/Pulse.app`).
  build-macos:
    needs: build-sign-publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Build app + dmg
        run: npx tauri build --bundles app,dmg -- --locked

      - name: Coletar artefatos e SHA-256
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/dmg/*.dmg out/
          (cd out && shasum -a 256 *.dmg > SHA256SUMS-macos.txt)
          { echo '```'; cat out/SHA256SUMS-macos.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-macos
          path: out/*
          if-no-files-found: error

      - name: Anexar à GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" out/* --clobber
